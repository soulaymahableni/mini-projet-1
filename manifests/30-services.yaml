apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  type: ClusterIP
  selector:
    app: api
    tier: backend
  ports:
    - port: 9898
      targetPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
spec:
  type: ClusterIP
  selector:
    app: frontend
    tier: web
  ports:
    - port: 80
      targetPort: 80
